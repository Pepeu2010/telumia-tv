name: Secret scan (Gitleaks)

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Read-only, including pull requests from forks.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The TV repository currently contains a gitlink without matching
      # .gitmodules metadata. actions/checkout credential cleanup fails on it.
      # Fetch the public repository without credentials or submodule traversal.
      - name: Fetch Git history without credentials or submodules
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-recurse-submodules --no-tags origin "${GITHUB_REF}"
          git checkout --detach --force FETCH_HEAD

      - name: Scan for leaked credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
